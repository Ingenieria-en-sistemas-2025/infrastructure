version: "3.9"

volumes:
  pg_authorization: {}
  pg_snippets: {}
  redis_data: {}
  certbot_conf:
    external: true
    name: certbot_conf
  certbot_www:
    external: true
    name: certbot_www
  blob: {}

services:
  pg-authorization:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
      POSTGRES_DB: authorization
    volumes:
      - pg_authorization:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d authorization"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg-snippets:
    image: postgres:16
    environment:
      POSTGRES_USER: ${SNIPPETS_DB_USER}
      POSTGRES_PASSWORD: ${SNIPPETS_DB_PASS}
      POSTGRES_DB: snippets
    volumes:
      - pg_snippets:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SNIPPETS_DB_USER} -d snippets"]
      interval: 5s
      timeout: 3s
      retries: 20

  event-bus:
    image: redis:7-alpine
    container_name: ps-event-bus
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "yes"]
    volumes: [ "redis_data:/data" ] # tolerancia a caídas
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    hostname: azurite
    restart: unless-stopped
    volumes:
      - blob:/workspace
    healthcheck:
      test: [ "CMD-SHELL", "pidof azurite-blob >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 20

  asset-service:
    image: ghcr.io/austral-ingsis/snippet-asset-service:${ASSET_TAG}
    environment:
      AZURE_HOST: ${AZURE_HOST}
      NEW_RELIC_APP_NAME: asset-service
      NEW_RELIC_AGENT_ENABLED: "false"
    depends_on:
      azurite:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 20

  execution:
    image: ${EXECUTION_IMAGE}:${EXECUTION_TAG}
    container_name: ps-execution
    environment:
      SERVER_PORT: 8080
      LOGGING_LEVEL_ROOT: INFO
      SPRING_DATA_REDIS_HOST: ps-event-bus
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: ps-event-bus
      REDIS_PORT: 6379
      STREAMS_ENABLED: true
      SNIPPETS_BASE_URL:  http://snippets:8080
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${AUTH0_ISSUER_URI}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      NEW_RELIC_AGENT_ENABLED: ${NEW_RELIC_AGENT_ENABLED}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_EXECUTION_APP_NAME:-printscript-execution}
      DEBUG: "true"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_AUTOCONFIGURE_CONDITION: DEBUG
      LOGGING_LEVEL_io_lettuce_core: DEBUG
      LOGGING_LEVEL_org_springframework_data_redis: DEBUG
    depends_on:
      event-bus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 30

  authorization:
    image: ${AUTH_IMAGE}:${AUTH_TAG}
    container_name: ps-authorization
    environment:
      SERVER_PORT: 8080
      LOGGING_LEVEL_ROOT: INFO
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg-authorization:5432/authorization
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASS}
      EXECUTION_BASE_URL: http://ps-execution:8080
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${AUTH0_ISSUER_URI}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      NEW_RELIC_AGENT_ENABLED: ${NEW_RELIC_AGENT_ENABLED}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_AUTH_APP_NAME:-printscript-authorization}
    depends_on:
      pg-authorization:
        condition: service_healthy
      execution:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 30

  snippets:
    image: ${SNIPPETS_IMAGE}:${SNIPPETS_TAG}
    container_name: ps-snippets
    environment:
      SERVER_PORT: 8080
      LOGGING_LEVEL_ROOT: INFO
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg-snippets:5432/snippets
      SPRING_DATASOURCE_USERNAME: ${SNIPPETS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SNIPPETS_DB_PASS}
      EXECUTION_BASE_URL: http://ps-execution:8080
      AUTHORIZATION_BASE_URL: http://authorization:8080
      AUTHORIZATION_SERVICE_URL: http://authorization:8080
      ASSET_SERVICE_BASE_URL: ${ASSET_SERVICE_BASE_URL}
      ASSET_CONTAINER_NAME: snippets
      SPRING_DATA_REDIS_HOST: ps-event-bus
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: ps-event-bus
      REDIS_PORT: 6379
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${AUTH0_ISSUER_URI}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      NEW_RELIC_AGENT_ENABLED: ${NEW_RELIC_AGENT_ENABLED}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_SNIPPETS_APP_NAME:-printscript-snippets}
    depends_on:
      pg-snippets:
        condition: service_healthy
      execution:
        condition: service_healthy
      event-bus:
        condition: service_healthy
      authorization:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/snippets/ping >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 30

  printscript-ui:
    image: ${UI_IMAGE}:${UI_TAG}
    container_name: ps-ui
    environment:
      VITE_FRONTEND_URL: ${VITE_FRONTEND_URL}
      VITE_API_BASE_URL: /api
      VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
      VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      VITE_AUTH0_SCOPE: ${VITE_AUTH0_SCOPE}
      TZ: America/Argentina/Buenos_Aires

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: ps-duckdns-updater
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN}
      - TOKEN=${DUCK_DNS_TOKEN}
    volumes:
      - ./config/duckdns:/config

  certbot:
    container_name: "ps-certbot"
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: >
      certonly --webroot -w /var/www/certbot/
      --force-renewal --email ${CERTBOT_EMAIL}
      -d ${DUCKDNS_DOMAIN} --agree-tos

  nginx:
    image: nginx:1.27
    container_name: ps-nginx
    depends_on:
      - printscript-ui
      - authorization
      - execution
      - snippets
      - duckdns
      - certbot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro